name: AI Autonomous Agent & Curated Registry CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  validate-ai-agent-ecosystem:
    name: Verify Curated Prompts & AI Agent Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.1

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @clickflash/ai Package and Dependencies
        run: pnpm --filter @clickflash/ai... run build

      - name: Run AI Agent Vitest Suite
        run: pnpm exec vitest run packages/ai/src/

      - name: Run ClickFlash MCP Server Test Suite
        run: pnpm --filter clickflash-mcp run test
