name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open Source AI Code Review
        uses: coderabbitai/coderabbit-action@v1
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: "llama-3-70b-instruct" # Force open source model via liteLLM or similar router if supported
