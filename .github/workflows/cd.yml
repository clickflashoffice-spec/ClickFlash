name: Cloudflare Pages Deployment

on:
  push:
    branches: [main]
    paths:
      - 'apps/management/**'
      - 'apps/gallery/**'
      - 'apps/website/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - management
          - gallery
          - website

env:
  NODE_VERSION: '20'

jobs:
  deploy-management:
    name: Deploy Management Hub
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.app == 'all' || github.event.inputs.app == 'management'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install & build
        run: |
          npm install --prefix apps/management --legacy-peer-deps
          npm run build --prefix apps/management
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/management/dist --project-name=management-hub --commit-dirty=true

  deploy-gallery:
    name: Deploy Customer Gallery
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.app == 'all' || github.event.inputs.app == 'gallery'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install & build
        run: |
          npm install --prefix apps/gallery --legacy-peer-deps
          npm run build --prefix apps/gallery
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/gallery/dist --project-name=click-flash-gallery --commit-dirty=true

  deploy-website:
    name: Deploy Website
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.app == 'all' || github.event.inputs.app == 'website'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install & build
        run: |
          npm install --prefix apps/website --legacy-peer-deps
          npm run build --prefix apps/website
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/website/out --project-name=clickflash-website --commit-dirty=true

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    if: github.event.inputs.app == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Gallery Backend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/gallery/backend
          command: deploy

      - name: Deploy Management Backend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/management/backend
          command: deploy
