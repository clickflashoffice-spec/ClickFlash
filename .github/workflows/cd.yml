name: Cloudflare Pages Deployment

on:
  push:
    branches: [main]
    paths:
      - 'apps/management/**'
      - 'apps/gallery/**'
      - 'apps/website/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - management
          - gallery
          - website

env:
  NODE_VERSION: '20'

jobs:
  deploy-management:
    name: Deploy Management Hub
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.app == 'all' || github.event.inputs.app == 'management' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Management Hub
        run: npm run build --prefix apps/management
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages (Management)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: management-hub
          directory: apps/management/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

  deploy-gallery:
    name: Deploy Customer Gallery
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.app == 'all' || github.event.inputs.app == 'gallery' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefix apps/gallery --legacy-peer-deps

      - name: Build Customer Gallery
        run: npm run build --prefix apps/gallery
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages (Gallery)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: click-flash-gallery
          directory: apps/gallery/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

  deploy-website:
    name: Deploy Website
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.app == 'all' || github.event.inputs.app == 'website' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefix apps/website --legacy-peer-deps

      - name: Build Website (static export)
        run: npm run build --prefix apps/website
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages (Website)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: clickflash-website
          directory: apps/website/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.app == 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Gallery Backend Worker
        run: |
          cd apps/gallery/backend
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Management Backend Worker
        run: |
          cd apps/management/backend
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-management, deploy-gallery, deploy-website]
    if: always()
    steps:
      - name: Health Check - Management Hub
        if: ${{ needs.deploy-management.result == 'success' }}
        run: |
          curl -f -s https://management-hub.pages.dev/api/health || exit 1
        timeout-minutes: 2

      - name: Health Check - Gallery
        if: ${{ needs.deploy-gallery.result == 'success' }}
        run: |
          curl -f -s https://gallery-backend.pages.dev/api/health || exit 1
        timeout-minutes: 2

      - name: Health Check - Website
        if: ${{ needs.deploy-website.result == 'success' }}
        run: |
          curl -f -s https://clickflash-website.pages.dev/ || exit 1
        timeout-minutes: 2
