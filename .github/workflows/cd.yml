name: Cloudflare Pages Deployment

on:
  push:
    branches: [main]
    paths:
      - 'apps/management/**'
      - 'apps/gallery/**'
      - 'apps/website/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - management
          - gallery
          - website

env:
  NODE_VERSION: '20'

jobs:
  deploy-management:
    name: Deploy Management Hub
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == 'management' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --prefix apps/management --legacy-peer-deps
      - run: npm run build --prefix apps/management
        env:
          NODE_ENV: production
      - run: npx wrangler pages deploy apps/management/dist --project-name=management-hub --commit-dirty=true

  deploy-gallery:
    name: Deploy Customer Gallery
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == 'gallery' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --prefix apps/gallery --legacy-peer-deps
      - run: npm run build --prefix apps/gallery
        env:
          NODE_ENV: production
      - run: npx wrangler pages deploy apps/gallery/dist --project-name=click-flash-gallery --commit-dirty=true

  deploy-website:
    name: Deploy Website
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == 'website' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --prefix apps/website --legacy-peer-deps
      - run: npm run build --prefix apps/website
        env:
          NODE_ENV: production
      - run: npx wrangler pages deploy apps/website/out --project-name=clickflash-website --commit-dirty=true

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    if: ${{ inputs.app == 'all' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g wrangler
      - name: Deploy Gallery Backend Worker
        run: wrangler deploy
        working-directory: apps/gallery/backend
      - name: Deploy Management Backend Worker
        run: wrangler deploy
        working-directory: apps/management/backend
