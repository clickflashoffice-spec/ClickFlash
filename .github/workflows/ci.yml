name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict Monorepo TypeCheck
        run: pnpm run typecheck:all

      - name: Run Shared Packages Tests
        run: pnpm run test:packages

      - name: Run Master Station Tests
        run: pnpm --filter clickflash-master test

      - name: Run Touch Kiosk Tests
        run: pnpm --filter clickflash-touch test

