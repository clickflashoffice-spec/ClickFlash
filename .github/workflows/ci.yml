name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Build (PR)
        if: github.event_name == 'pull_request'
        run: npx turbo run typecheck lint test --filter=...[origin/main]

      - name: Turbo Build (Main)
        if: github.event_name == 'push'
        run: npx turbo run typecheck lint test
