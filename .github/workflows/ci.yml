name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'

jobs:
  # ───────────────────────────────────────────
  # 1. Lint & Typecheck (per-app matrix)
  # ───────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: master
            pkg: clickflash-master
          - app: touch
            pkg: clickflash-touch
          - app: gallery
            pkg: star-master-customer
          - app: management
            pkg: star-master-management
          - app: moneytrash
            pkg: moneytrash-uploader
          - app: website
            pkg: main-website
          - app: installer
            pkg: clickflash-installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ${{ matrix.pkg }} run lint

      - name: Typecheck
        run: pnpm --filter ${{ matrix.pkg }} run typecheck

  # ───────────────────────────────────────────
  # 2. Unit & Integration Tests (per-app matrix)
  # ───────────────────────────────────────────
  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: master
            pkg: clickflash-master
          - app: touch
            pkg: clickflash-touch
          - app: gallery
            pkg: star-master-customer
          - app: management
            pkg: star-master-management
          - app: moneytrash
            pkg: moneytrash-uploader
          - app: website
            pkg: main-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "@clickflash/*" run build

      - name: Run tests
        run: pnpm --filter ${{ matrix.pkg }} run test
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage
        if: matrix.app == 'master'
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/${{ matrix.app }}/coverage/lcov.info
          fail_ci_if_error: false

  # ───────────────────────────────────────────
  # 3. E2E Tests (cross-app)
  # ───────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build all apps
        run: pnpm run build:all

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # ───────────────────────────────────────────
  # 4. Security Audit
  # ───────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (critical)
        run: pnpm audit --audit-level=critical
        continue-on-error: true

      - name: Lint all
        run: pnpm run lint:all

      - name: Typecheck all
        run: pnpm run typecheck:all

      - name: Check for secrets (truffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
