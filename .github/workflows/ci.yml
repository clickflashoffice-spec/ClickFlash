name: ClickFlash V6 CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Biometric Air-Gap & Security Guards
        run: pnpm run test:security-guards

      - name: Build Shared Packages
        run: pnpm --filter "./packages/*" run build

      - name: Strict Monorepo TypeCheck
        run: pnpm run typecheck:all

      - name: Run Global Test Matrix (V6 Quality Gate)
        run: pnpm run test:all

      - name: Installer Package Tests
        run: pnpm --filter clickflash-installer test

      - name: Linting
        run: pnpm run lint:all
