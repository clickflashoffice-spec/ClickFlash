name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'

jobs:
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: master
            package: clickflash-master
          - app: touch
            package: clickflash-touch
          - app: gallery
            package: star-master-customer
          - app: management
            package: star-master-management
          - app: moneytrash
            package: moneytrash-uploader
          - app: website
            package: main-website
          - app: installer
            package: clickflash-installer
          - app: license-generator
            package: clickflash-license-generator
          - app: mobile-photographer
            package: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter ${{ matrix.package }} run lint

  typecheck:
    name: Typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: master
            package: clickflash-master
            script: typecheck:ci
          - app: touch
            package: clickflash-touch
            script: typecheck:ci
          - app: gallery
            package: star-master-customer
            script: typecheck
          - app: management
            package: star-master-management
            script: typecheck
          - app: moneytrash
            package: moneytrash-uploader
            script: typecheck
          - app: website
            package: main-website
            script: typecheck
          - app: installer
            package: clickflash-installer
            script: typecheck
          - app: license-generator
            package: clickflash-license-generator
            script: typecheck
          - app: mobile-photographer
            package: mobile
            script: typecheck
          - app: cloud-backend
            package: cloud-backend
            script: typecheck
          - app: gallery-worker
            package: gallery-backend
            script: typecheck
          - app: management-worker
            package: management-backend
            script: build
          - app: moneytrash-worker
            package: moneytrash-cloudflare-api
            script: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter ${{ matrix.package }} run ${{ matrix.script }}

  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: master
            package: clickflash-master
            script: test:ci
          - app: touch
            package: clickflash-touch
            script: test:ci
          - app: gallery
            package: star-master-customer
            script: test:ci
          - app: management
            package: star-master-management
            script: test:ci
          - app: moneytrash
            package: moneytrash-uploader
            script: test:ci
          - app: website
            package: main-website
            script: test:ci
          - app: installer
            package: clickflash-installer
            script: test
          - app: license-generator
            package: clickflash-license-generator
            script: test
          - app: cloud-backend
            package: cloud-backend
            script: test
          - app: gallery-worker
            package: gallery-backend
            script: test
          - app: management-worker
            package: management-backend
            script: test
          - app: moneytrash-worker
            package: moneytrash-cloudflare-api
            script: test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "@clickflash/*" --if-present run build
      - name: Run tests
        run: pnpm --filter ${{ matrix.package }} run ${{ matrix.script }}
        env:
          CI: true
          NODE_ENV: test
      - name: Upload coverage
        if: matrix.app == 'master'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: ./apps/master/coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    name: Ecosystem E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Build all apps
        run: pnpm run build:all
      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 4
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit critical dependencies
        run: pnpm audit --audit-level=critical
      - name: Scan repository for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
