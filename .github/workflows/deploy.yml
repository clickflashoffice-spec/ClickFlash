name: Deploy ClickFlash Ecosystem

on:
  push:
    branches: [main, production]
    paths:
      - 'apps/gallery/**'
      - 'apps/moneytrash/**'
      - 'apps/management/**'
      - 'apps/website/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        type: choice
        options:
          - all
          - gallery
          - moneytrash
          - management
          - website

jobs:
  deploy-gallery:
    if: github.event.inputs.app == 'all' || github.event.inputs.app == 'gallery' || github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Gallery Worker
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10.28.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Gallery
        run: pnpm --filter star-master-customer run build

      - name: Deploy Gallery Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/gallery/backend
          command: deploy

  deploy-moneytrash:
    if: github.event.inputs.app == 'all' || github.event.inputs.app == 'moneytrash' || github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy MoneyTrash Worker
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10.28.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Deploy MoneyTrash Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/moneytrash/cloudflare
          command: deploy

  deploy-management:
    if: github.event.inputs.app == 'all' || github.event.inputs.app == 'management' || github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Management Worker
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10.28.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Management Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/management/backend
          command: deploy

  deploy-website:
    if: github.event.inputs.app == 'all' || github.event.inputs.app == 'website' || github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Website Pages
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10.28.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Website
        run: pnpm --filter main-website exec npx @cloudflare/next-on-pages

      - name: Deploy Website Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/website
          command: pages deploy .vercel/output/static --project-name=clickflash-website --branch=main --commit-dirty=true
