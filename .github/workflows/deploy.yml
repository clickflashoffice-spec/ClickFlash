name: Cloudflare Worker Deployment

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cloud-backend
          - update-server

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'

jobs:
  deploy:
    name: Deploy ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cloud-backend
            name: Cloud Backend
            path: apps/cloud-backend
          - id: update-server
            name: Update Server
            path: workers/update-server
    steps:
      - name: Checkout
        if: github.event_name == 'push' || inputs.worker == 'all' || inputs.worker == matrix.id
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: github.event_name == 'push' || inputs.worker == 'all' || inputs.worker == matrix.id
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: github.event_name == 'push' || inputs.worker == 'all' || inputs.worker == matrix.id
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event_name == 'push' || inputs.worker == 'all' || inputs.worker == matrix.id
        run: pnpm install --frozen-lockfile

      - name: Apply ClickFlash DB migrations
        if: matrix.id == 'cloud-backend' && (github.event_name == 'push' || inputs.worker == 'all' || inputs.worker == 'cloud-backend')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/cloud-backend
          command: d1 migrations apply clickflash-db --remote

      - name: Deploy Worker
        if: github.event_name == 'push' || inputs.worker == 'all' || inputs.worker == matrix.id
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.path }}
          command: deploy
