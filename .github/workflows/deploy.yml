name: Cloudflare Worker Deployment

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - gallery
          - management
          - moneytrash
          - update-server

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'

jobs:
  deploy:
    name: Deploy ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gallery
            name: Gallery Worker
            path: workers/gallery-worker
          - id: management
            name: Management Worker
            path: workers/management-worker
          - id: moneytrash
            name: MoneyTrash Worker
            path: workers/moneytrash-worker
          - id: update-server
            name: Update Server
            path: workers/update-server
    steps:
      - name: Checkout
        if: inputs.worker == 'all' || inputs.worker == matrix.id
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.worker == 'all' || inputs.worker == matrix.id
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: inputs.worker == 'all' || inputs.worker == matrix.id
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: inputs.worker == 'all' || inputs.worker == matrix.id
        run: pnpm install --frozen-lockfile

      - name: Apply Gallery DB migrations
        if: matrix.id == 'gallery' && (inputs.worker == 'all' || inputs.worker == 'gallery')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/gallery-worker
          command: d1 migrations apply gallery-db --remote

      - name: Apply Website DB migrations
        if: matrix.id == 'gallery' && (inputs.worker == 'all' || inputs.worker == 'gallery')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/gallery-worker
          command: d1 migrations apply clickflash-website-db --remote

      - name: Apply Management DB migrations
        if: matrix.id == 'management' && (inputs.worker == 'all' || inputs.worker == 'management')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/management-worker
          command: d1 migrations apply management-db --remote

      - name: Apply MoneyTrash DB migrations
        if: matrix.id == 'moneytrash' && (inputs.worker == 'all' || inputs.worker == 'moneytrash')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/moneytrash-worker
          command: d1 migrations apply moneytrash-db --remote

      - name: Deploy Worker
        if: inputs.worker == 'all' || inputs.worker == matrix.id
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.path }}
          command: deploy
