name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'

jobs:
  # ───────────────────────────────────────────
  # 1. Changed Files Detection
  # ───────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      master: ${{ steps.changes.outputs.master }}
      touch: ${{ steps.changes.outputs.touch }}
      gallery: ${{ steps.changes.outputs.gallery }}
      management: ${{ steps.changes.outputs.management }}
      moneytrash: ${{ steps.changes.outputs.moneytrash }}
      website: ${{ steps.changes.outputs.website }}
      installer: ${{ steps.changes.outputs.installer }}
      shared: ${{ steps.changes.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            master:
              - 'apps/master/**'
              - 'packages/**'
            touch:
              - 'apps/touch/**'
              - 'packages/**'
            gallery:
              - 'apps/gallery/**'
              - 'packages/**'
            management:
              - 'apps/management/**'
              - 'packages/**'
            moneytrash:
              - 'apps/moneytrash/**'
              - 'packages/**'
            website:
              - 'apps/website/**'
              - 'packages/**'
            installer:
              - 'apps/installer/**'
              - 'packages/**'
            shared:
              - 'packages/**'
              - 'turbo.json'
              - 'pnpm-workspace.yaml'

  # ───────────────────────────────────────────
  # 2. Lint & Typecheck (conditional on changes)
  # ───────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: master
            pkg: clickflash-master
            changed: ${{ needs.changes.outputs.master }}
          - app: touch
            pkg: clickflash-touch
            changed: ${{ needs.changes.outputs.touch }}
          - app: gallery
            pkg: star-master-customer
            changed: ${{ needs.changes.outputs.gallery }}
          - app: management
            pkg: star-master-management
            changed: ${{ needs.changes.outputs.management }}
          - app: moneytrash
            pkg: moneytrash-uploader
            changed: ${{ needs.changes.outputs.moneytrash }}
          - app: website
            pkg: main-website
            changed: ${{ needs.changes.outputs.website }}
          - app: installer
            pkg: clickflash-installer
            changed: ${{ needs.changes.outputs.installer }}
    steps:
      - name: Checkout
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter ${{ matrix.pkg }} run lint
        continue-on-error: true

      - name: Typecheck
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter ${{ matrix.pkg }} run typecheck
        continue-on-error: true

  # ───────────────────────────────────────────
  # 3. Tests (conditional on changes)
  # ───────────────────────────────────────────
  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: master
            pkg: clickflash-master
            changed: ${{ needs.changes.outputs.master }}
          - app: touch
            pkg: clickflash-touch
            changed: ${{ needs.changes.outputs.touch }}
          - app: gallery
            pkg: star-master-customer
            changed: ${{ needs.changes.outputs.gallery }}
          - app: management
            pkg: star-master-management
            changed: ${{ needs.changes.outputs.management }}
          - app: moneytrash
            pkg: moneytrash-uploader
            changed: ${{ needs.changes.outputs.moneytrash }}
          - app: website
            pkg: main-website
            changed: ${{ needs.changes.outputs.website }}
    steps:
      - name: Checkout
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter "@clickflash/*" run build

      - name: Run tests
        if: matrix.changed == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter ${{ matrix.pkg }} run test
        env:
          CI: true
          NODE_ENV: test

  # ───────────────────────────────────────────
  # 4. PR Metadata Checks
  # ───────────────────────────────────────────
  pr-checks:
    name: PR Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            master
            touch
            gallery
            management
            moneytrash
            website
            installer
            shared
            deps
            security
          requireScope: true

      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const required = ['## Description', '## Changes', '## Testing'];
            const missing = required.filter(r => !body.includes(r));
            if (missing.length > 0) {
              core.setFailed(`PR description missing sections: ${missing.join(', ')}`);
            }

  # ───────────────────────────────────────────
  # 5. Size Limits
  # ───────────────────────────────────────────
  size-limit:
    name: Bundle Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check bundle sizes
        run: |
          pnpm --filter main-website run build
          pnpm --filter clickflash-master run build
          echo "Bundle sizes checked"
        continue-on-error: true
