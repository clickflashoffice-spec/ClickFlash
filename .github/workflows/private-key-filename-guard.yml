name: Private key filename guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tracked-private-key-filenames:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test filename guard
        run: node --test scripts/check-tracked-private-key-filenames.test.mjs

      - name: Reject tracked private-key filenames
        run: node scripts/check-tracked-private-key-filenames.mjs
