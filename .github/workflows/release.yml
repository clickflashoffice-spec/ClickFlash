name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 4.3.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'

jobs:
  # ───────────────────────────────────────────
  # 1. Build Desktop Apps
  # ───────────────────────────────────────────
  build-desktop:
    name: Build Desktop Apps (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Master
        run: pnpm --filter clickflash-master run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Touch
        run: pnpm --filter clickflash-touch run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Installer
        run: pnpm --filter clickflash-installer run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Authenticode Signatures
        if: matrix.os == 'windows-latest'
        run: |
          $executables = Get-ChildItem -Path . -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'release' }
          $failed = $false
          foreach ($exe in $executables) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature invalid or missing for $($exe.FullName)"
              $failed = $true
            } else {
              Write-Host "Valid signature for $($exe.FullName)"
            }
          }
          if ($failed) {
            exit 1
          }
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/master/release/*.exe
            apps/master/release/*.dmg
            apps/touch/release/*.exe
            apps/touch/release/*.dmg
            apps/installer/release/*.exe
            apps/installer/release/*.dmg

  # ───────────────────────────────────────────
  # 2. Build Web Apps
  # ───────────────────────────────────────────
  build-web:
    name: Build & Deploy Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build Web Apps
        run: |
          pnpm --filter main-website run build
          pnpm --filter star-master-gallery run build
          pnpm --filter star-master-management run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: clickflash-web
          directory: apps/website/.next

  # ───────────────────────────────────────────
  # 3. Build Mobile Apps (EAS)
  # ───────────────────────────────────────────
  build-mobile:
    name: Build Mobile Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build Mobile Photographer
        run: pnpm --filter mobile-photographer exec eas build --platform all --profile production --non-interactive
      - name: Build Mobile Customer
        run: pnpm --filter mobile-customer exec eas build --platform all --profile production --non-interactive

  # ───────────────────────────────────────────
  # 4. Build Shared Packages
  # ───────────────────────────────────────────
  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm run build --filter "./packages/*"

  # ───────────────────────────────────────────
  # 5. Create GitHub Release
  # ───────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-desktop, build-web, build-mobile, build-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-win
          path: ./artifacts/win

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac
          path: ./artifacts/mac

      - name: Verify Artifacts and Generate Checksums
        run: |
          if [ ! -d "./artifacts/win" ] || [ -z "$(ls -A ./artifacts/win 2>/dev/null)" ]; then
            echo "Error: No Windows artifacts found!"
            exit 1
          fi
          cd artifacts
          sha256sum win/**/*.exe mac/**/*.dmg > checksums.txt || echo "Hashes generated for existing files"
          cat checksums.txt
        shell: bash

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: .github/changelog-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: ClickFlash ${{ github.ref_name || github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: true
          prerelease: ${{ contains(github.ref_name || github.event.inputs.version, 'beta') || contains(github.ref_name || github.event.inputs.version, 'alpha') }}
          files: |
            ./artifacts/win/**/*.exe
            ./artifacts/mac/**/*.dmg
            ./artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
