name: Release Workflow

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Pipeline (Typecheck & Lint)
        run: |
          pnpm run typecheck:all
          pnpm run lint:all

      - name: Build All Projects
        run: pnpm run build:all

      - name: Auto-publish Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter cloud-backend run deploy

      - name: Build Electron Installer (Windows)
        run: |
          pnpm --filter desktop-installer run make --platform=win32

      - name: Generate GitHub Release with Changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

