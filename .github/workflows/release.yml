name: Release Workflow

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@10.28.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Pipeline (Typecheck & Lint)
        run: |
          pnpm run typecheck:all
          pnpm run lint:all

      - name: Build All Projects
        run: pnpm run build:all

      - name: Auto-publish Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter cloud-backend run deploy

      - name: Build Electron Installer (Windows)
        run: |
          pnpm --filter desktop-installer run make --platform=win32

      - name: Generate GitHub Release with Changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
