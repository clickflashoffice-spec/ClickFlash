name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 4.3.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'

jobs:
  # ───────────────────────────────────────────
  # 1. Build Desktop Apps
  # ───────────────────────────────────────────
  build-desktop:
    name: Build Desktop Apps (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Master
        run: pnpm --filter clickflash-master run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Touch
        run: pnpm --filter clickflash-touch run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Installer
        run: pnpm --filter clickflash-installer run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/master/release/*.exe
            apps/master/release/*.dmg
            apps/touch/release/*.exe
            apps/touch/release/*.dmg
            apps/installer/release/*.exe
            apps/installer/release/*.dmg

  # ───────────────────────────────────────────
  # 2. Create GitHub Release
  # ───────────────────────────────────────────
  release:
    name: Create Release
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-win
          path: ./artifacts/win

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac
          path: ./artifacts/mac

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: .github/changelog-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: ClickFlash ${{ github.ref_name || inputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: true
          prerelease: ${{ contains(github.ref_name || inputs.version, 'beta') || contains(github.ref_name || inputs.version, 'alpha') }}
          files: |
            ./artifacts/win/**/*.exe
            ./artifacts/mac/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sentry notification removed — error tracking handled by custom logger
