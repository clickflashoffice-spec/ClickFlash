name: Rotate API Keys

on:
  schedule:
    # Run monthly (first day of each month at 2am)
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes)'
        type: boolean
        default: false

jobs:
  rotate-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check key rotation status
        run: |
          echo "Checking API key ages..."
          node scripts/rotate-api-keys.js
        env:
          # Scheduled cron runs should perform real rotation (dry_run defaults
          # to false). Manual workflow_dispatch can pass dry_run=true to preview.
          ROTATION_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ROTATION_NOTIFY: ${{ secrets.NOTIFY_EMAIL }}

      - name: Create rotation log
        if: always()
        run: |
          echo "## API Key Rotation $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "API Key rotation failed - manual intervention required"
        # Add email notification step here if configured