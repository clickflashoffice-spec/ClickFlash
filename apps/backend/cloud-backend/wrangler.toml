name = "cloud-backend"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = [ "nodejs_compat" ]

[[r2_buckets]]
binding = "PHOTO_BUCKET"
bucket_name = "clickflash-photos"

# Local development creates a persisted preview namespace automatically.
# Production deployment must supply the provisioned namespace ID explicitly.
[[kv_namespaces]]
binding = "SESSION_KV"
id = "aba18d1fd83c4291b34d2ad49afc225c"

[[queues.producers]]
queue = "ai-tagger-queue"
binding = "AI_TAGGER_QUEUE"

[[d1_databases]]
binding = "DB"
database_name = "clickflash-db"
database_id = "74b44376-3e3b-4f94-8ddd-61bf30dffa5d"
migrations_dir = "migrations"

[[d1_databases]]
binding = "DB_MENA"
database_name = "clickflash-db-mena"
database_id = "85c55487-4f4c-4e55-9eee-72ca41eaab6e"

[[d1_databases]]
binding = "DB_EU"
database_name = "clickflash-db-eu"
database_id = "96d66598-5d5d-4e66-0fff-83da52faac7f"

[[d1_databases]]
binding = "DB_AMER"
database_name = "clickflash-db-amer"
database_id = "a7e776a9-6e6e-4f77-1ddd-94ea63faad8e"

[[d1_databases]]
binding = "DB_APAC"
database_name = "clickflash-db-apac"
database_id = "b8f887ba-7f7f-4b88-2ccc-a5fa74faaf9a"

