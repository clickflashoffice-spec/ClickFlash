appId: com.clickflash.installer
productName: ClickFlash Studio Setup
copyright: Copyright © 2026 ClickFlash Photography

directories:
  output: release
  buildResources: build

files:
  - dist/renderer/**/*
  - dist/electron/**/*
  - package.json
  - "!node_modules/**/*"

extraResources:
  - from: build/generated/license-public-key.txt
    to: license-public-key.txt

asar: true
afterPack: scripts/verify-packaged-artifact.cjs

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: ../management/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target: nsis
  requestedExecutionLevel: requireAdministrator

nsis:
  oneClick: true
  perMachine: true
  deleteAppDataOnUninstall: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: ClickFlash Studio Setup
  artifactName: ClickFlash-Studio-Setup-${version}-${arch}.${ext}
  include: scripts/nsis-installer.nsh

compression: normal

electronVersion: "39.8.7"
npmRebuild: false
nodeGypRebuild: false

publish:
  provider: github
  owner: clickflash
  repo: clickflash-installer
  releaseType: release
  vPrefixedTagName: true

afterSign: "ev-sign.cjs"
