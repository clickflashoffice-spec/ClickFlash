<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ClickFlash Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .nav {
            display: flex;
            gap: 20px;
        }
        .nav a {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .nav a:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
        }
        .card h3 {
            margin-top: 0;
            color: #94a3b8;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .album-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
        }
        .album-item:hover {
            background: rgba(255,255,255,0.1);
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard</h1>
        <nav class="nav">
            <a href="#" data-testid="nav-albums">Albums</a>
            <a href="#" data-testid="nav-photos">Photos</a>
            <a href="#" data-testid="nav-settings">Settings</a>
            <button data-testid="logout-button">Logout</button>
        </nav>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Total Albums</h3>
            <p style="font-size: 48px; margin: 0;">42</p>
        </div>
        <div class="card">
            <h3>Total Photos</h3>
            <p style="font-size: 48px; margin: 0;">1,234</p>
        </div>
        <div class="card">
            <h3>Pending Orders</h3>
            <p style="font-size: 48px; margin: 0;">5</p>
        </div>
    </div>

    <h2 style="margin-top: 40px;">Recent Albums</h2>
    <div class="album-grid" data-testid="album-grid">
        <div class="album-item" data-testid="album-item">
            <h4>Wedding Smith</h4>
            <p>150 photos</p>
        </div>
        <div class="album-item" data-testid="album-item">
            <h4>Corporate Event</h4>
            <p>89 photos</p>
        </div>
        <div class="album-item" data-testid="album-item">
            <h4>Portrait Session</h4>
            <p>45 photos</p>
        </div>
    </div>

    <script>
        // Mock logout
        document.querySelector('[data-testid="logout-button"]').addEventListener('click', () => {
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
