[package]
name = "moneytrash"
version = "2.0.0"
description = "ClickFlash MoneyTrash - Rapid Photo Ingestion & Culling Engine"
authors = ["ClickFlash Team"]
edition = "2021"

[lib]
name = "moneytrash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
rayon = "1.10"
walkdir = "2.5"
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
