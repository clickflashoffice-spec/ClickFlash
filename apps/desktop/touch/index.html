<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'unsafe-inline' 'self' http://localhost:* http://127.0.0.1:* data: blob:; style-src 'unsafe-inline' 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; connect-src 'self' http: is: ws: wss: data: blob:; img-src 'self' data: blob: https: http:;"
    />
    <title>ClickFlash - Touch Kiosk</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <meta
      name="description"
      content="Star Master Photography OS - Touch Kiosk Interface"
    />
    <link rel="stylesheet" href="/src/styles/base.css" />
  </head>

  <body
    class="bg-white dark:bg-slate-900 text-slate-900 dark:text-white select-none touch-manipulation"
  >
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .then((reg) =>
              console.log("SW registration successful:", reg.scope),
            )
            .catch((err) => console.log("SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
