name = "gallery-backend"
main = "src/server.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# [env.staging]
# name = "gallery-backend-staging"
# [[env.staging.d1_databases]]
# binding = "GALLERY_DB"
# database_name = "gallery-db-staging"
# database_id = "STAGING_ID_HERE"

# [env.production]
[[d1_databases]]
binding = "GALLERY_DB"
database_name = "gallery-db"
database_id = "b556a025-1ada-46f1-ac15-2f7d117ca350" 

[[d1_databases]]
binding = "WEBSITE_DB"
database_name = "clickflash-website-db"
database_id = "5f78535b-10d3-45b4-af94-a6e5a061cac5"

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "clickflash-gallery-assets"

[vars]
NODE_ENV = "production"
ALLOWED_ORIGINS = "https://gallery.clickflash.com,https://clickflash.com,https://clicketflash.com"
DEPLOY_ENV = "production"

# Hardened Security Policy
GEO_RESTRICTED = "true"
ALLOWED_COUNTRIES = "MA,TN,FR,US"
WAF_RATE_LIMIT = "100/min"
SENTRY_PROJECT = "clickflash-gallery"

# Secrets — set via CLI:
# wrangler secret put JWT_SECRET --env production
# wrangler secret put STRIPE_SECRET_KEY --env production
# wrangler secret put STRIPE_WEBHOOK_SECRET --env production
# wrangler secret put SENTRY_DSN --env production

[observability]
enabled = true
