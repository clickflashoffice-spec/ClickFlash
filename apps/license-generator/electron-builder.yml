appId: com.clickflash.license-generator
productName: ClickFlash License Generator
copyright: Copyright © 2026 ClickFlash Studio

files:
  - dist/renderer/**/*
  - dist/**/*.js
  - assets/icon.png
  - package.json
  - "!node_modules/@clickflash/**/*"

npmRebuild: false
nodeGypRebuild: false
electronVersion: "39.8.7"
afterPack: scripts/verify-packaged-artifact.cjs

win:
  icon: assets/icon.png
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

directories:
  output: release

afterSign: "ev-sign.cjs"
