<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP handled at edge via Cloudflare headers (meta CSP removed - was blocking Google Fonts & causing blank render) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>ClickFlash - HQ</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="manifest" href="./manifest.json" />
    <!-- Theme Color removed to satisfy cross-browser lints -->
    <meta
      name="description"
      content="ClickFlash Photography OS - Management Headquarters"
    />
  </head>

  <body class="bg-slate-50 dark:bg-slate-900">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .then((reg) =>
              console.log("SW registration successful:", reg.scope),
            )
            .catch((err) => console.log("SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
