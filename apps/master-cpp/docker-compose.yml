version: '3.8'

services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - CF_DB_PATH=/app/data/clickflash.db
      - CF_DB_KEY=${CF_DB_KEY}
      - CF_MIGRATIONS_DIR=/app/migrations
      - CF_PORT=8090
      - CF_THREADS=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: PostgreSQL for shared state (future)
  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: clickflash
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: clickflash
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  master_data:
