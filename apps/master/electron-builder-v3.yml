appId: com.clickflash.master.v3
productName: ClickFlash Master OS
copyright: Copyright © 2025 ClickFlash Photography
buildVersion: "4.3.0"
directories:
  output: release_v3
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!pb_data/**/*"
  - "!storage/**/*"
  - "!node_modules/**/*"
  - electron-main-new.js
  - electron-new/dist/**/*
  - electron-new/dist/main/**/*
  - electron-new/dist/preload/**/*
  - electron-main.js
  - .env.production
extraMetadata:
  main: electron-new/dist/main/index.js
extraResources:
  - from: pb_data
    to: pb_data
    filter:
      - "!**/*"
  - from: backend
    to: backend
    filter:
      - "**/*"
  - from: helper_scripts
    to: helper_scripts
  - from: public/models
    to: models
    filter:
      - "**/*"
win:
  target: nsis
  icon: build/icon.png
  requestedExecutionLevel: requireAdministrator
  forceCodeSigning: false
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: true
  deleteAppDataOnUninstall: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
  shortcutName: ClickFlash Master OS

electronVersion: 39.2.7
npmRebuild: true
asar: true
asarUnpack:
  - "backend/**/*"
  - "node_modules/sharp/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/@tensorflow/**/*"
  - "public/models/**/*"

publish:
  provider: github
  owner: clickflash
  repo: clickflash-master
  releaseType: release
  vPrefixedTagName: true
