appId: com.clickflash.master
productName: ClickFlash Master OS
copyright: Copyright © 2025 ClickFlash Photography

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!pb_data/**/*"
  - "!storage/**/*"
  - "!src/**/*"
  - "!backend/**/*"
  - "!scripts/**/*"
  - "!build/**/*"
  - "!**/*.map"
  - node_modules/**/*

# CRITICAL: Native .node binaries MUST be unpacked from asar.
# fork() with ELECTRON_RUN_AS_NODE cannot read asar archives.
# List EVERY package that ships native binaries - no glob wildcards.
asarUnpack:
  - "dist/**/*"
  - "node_modules/better-sqlite3-multiple-ciphers"
  - "node_modules/sharp"
  - "node_modules/@img"
  - "node_modules/@napi-rs"
  - "node_modules/bindings"
  - "node_modules/file-uri-to-path"

extraResources:
  - from: installer_scripts
    to: installer_scripts
  - from: helper_scripts
    to: helper_scripts
  - from: public/models
    to: models
    filter:
      - "**/*"
  - from: public/favicon.png
    to: tray-icon.png

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: requireAdministrator
  forceCodeSigning: false
  signAndEditExecutable: false

compression: normal

nsis:
  oneClick: true
  perMachine: true
  include: build/installer.nsh
  deleteAppDataOnUninstall: true
  
  createDesktopShortcut: false
  runAfterFinish: false
  shortcutName: ClickFlash Master OS

electronVersion: "39.8.7"
npmRebuild: false
asar: true

afterPack: scripts/ensure-native-deps.js

publish:
  provider: github
  owner: clickflash
  repo: clickflash-master
  releaseType: release
  vPrefixedTagName: true
