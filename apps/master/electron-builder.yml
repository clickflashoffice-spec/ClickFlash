appId: com.clickflash.master
productName: ClickFlash Master OS
copyright: Copyright © 2025 ClickFlash Photography

directories:
  output: release
  buildResources: build

# Files bundled into the asar
files:
  - dist/**/*
  - electron-main.js
  - preload.js
  - package.json
  - "!pb_data/**/*"
  - "!storage/**/*"
  - "!node_modules/**/*"

# Files unpacked alongside the asar (native modules, large assets)
asarUnpack:
  - "node_modules/sharp/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/better-sqlite3-multiple-ciphers/**/*"
  - "node_modules/@tensorflow/**/*"
  - "node_modules/@napi-rs/**/*"

# Extra files copied to the resources directory
extraResources:
  - from: helper_scripts
    to: helper_scripts
  - from: public/models
    to: models
    filter:
      - "**/*"

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: requireAdministrator
  forceCodeSigning: false
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: true
  deleteAppDataOnUninstall: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  runAfterFinish: false
  shortcutName: ClickFlash Master OS

electronVersion: "39.2.7"
npmRebuild: true
asar: true
