appId: com.clickflash.master
productName: ClickFlash Master OS
copyright: Copyright © 2025 ClickFlash Photography

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron-main.js
  - preload.js
  - package.json
  - "!pb_data/**/*"
  - "!storage/**/*"
  - "!src/**/*"
  - "!backend/**/*"
  - "!scripts/**/*"
  - "!build/**/*"
  - "!**/*.map"
  # Include production node_modules that are specifically needed for native components
  - node_modules/better-sqlite3-multiple-ciphers/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/@napi-rs/canvas-win32-x64-msvc/**/*
  - node_modules/@napi-rs/canvas-win32-x64/**/*

# CRITICAL: Native .node binaries MUST be unpacked from asar.
# fork() with ELECTRON_RUN_AS_NODE cannot read asar archives.
# List EVERY package that ships native binaries - no glob wildcards.
asarUnpack:
  - "dist/backend/**/*"
  - "node_modules/better-sqlite3-multiple-ciphers"
  - "node_modules/sharp"
  - "node_modules/@img"
  - "node_modules/@napi-rs"

extraResources:
  - from: helper_scripts
    to: helper_scripts
  - from: public/models
    to: models
    filter:
      - "**/*"

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: requireAdministrator
  forceCodeSigning: false
  signAndEditExecutable: false

compression: normal

nsis:
  oneClick: false
  perMachine: true
  deleteAppDataOnUninstall: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  runAfterFinish: false
  shortcutName: ClickFlash Master OS

electronVersion: "39.8.7"
npmRebuild: false
asar: true

afterPack: scripts/generate-guardian-hash.js
