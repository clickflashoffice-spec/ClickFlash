appId: com.clickflash.master
productName: ClickFlash Master OS
copyright: Copyright © 2025 ClickFlash Photography

directories:
  output: release
  buildResources: build

# Files bundled into the asar
files:
  - dist/**/*
  - electron-main.js
  - preload.js
  - package.json
  - "!pb_data/**/*"
  - "!storage/**/*"
  - "!src/**/*"
  - "!backend/**/*"
  - "!scripts/**/*"
  - "!build/**/*"
  - "!*.ts"
  - "!*.tsx"
  - "!tsconfig*.json"
  - "!vite.config.*"

# Unpack backend + ALL node_modules from asar
# Required because fork() with ELECTRON_RUN_AS_NODE strips asar support
asarUnpack:
  - "dist/backend/**/*"
  - "node_modules/**/*"

# Extra files copied to the resources directory
extraResources:
  - from: helper_scripts
    to: helper_scripts
  - from: public/models
    to: models
    filter:
      - "**/*"

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: requireAdministrator
  forceCodeSigning: false
  signAndEditExecutable: false

compression: store

nsis:
  oneClick: false
  perMachine: true
  deleteAppDataOnUninstall: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  runAfterFinish: false
  shortcutName: ClickFlash Master OS

electronVersion: "39.2.7"
npmRebuild: true
asar: true
