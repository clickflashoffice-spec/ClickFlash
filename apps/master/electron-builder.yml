appId: com.clickflash.master
productName: ClickFlash Master OS
copyright: Copyright © 2025 ClickFlash Photography

directories:
  output: release
  buildResources: build

# Files bundled into the asar
files:
  - dist/**/*
  - electron-main.js
  - preload.js
  - package.json
  - "!pb_data/**/*"
  - "!storage/**/*"
  - "!src/**/*"
  - "!backend/**/*"
  - "!scripts/**/*"
  - "!build/**/*"
  - "!*.ts"
  - "!*.tsx"
  - "!tsconfig*.json"
  - "!vite.config.*"
  - "!**/*.map"

# Unpack backend and native .node binaries from asar.
# fork() with ELECTRON_RUN_AS_NODE strips asar support, so the backend bundle
# must be outside the asar. Only packages that ship native .node addons need
# asarUnpack — listing node_modules/**/* would extract 50 k+ files and make
# the NSIS installer crawl. Enumerate only the three runtime native packages.
asarUnpack:
  - "dist/backend/**/*"
  - "node_modules/better-sqlite3-multiple-ciphers/**/*"
  - "node_modules/@img/sharp-win32-x64/**/*"
  - "node_modules/@napi-rs/canvas-win32-x64-msvc/**/*"

# Extra files copied to the resources directory
extraResources:
  - from: helper_scripts
    to: helper_scripts
  - from: public/models
    to: models
    filter:
      - "**/*"

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: requireAdministrator
  forceCodeSigning: false
  signAndEditExecutable: false
  # publisherName is used by electron-updater to verify the code-signing certificate
  # on downloaded updates before installing. Set this to your EV cert CN.
  # publisherName: "ClickFlash Photography SARL"

# Update feed — HTTPS only. Uncomment and configure before enabling auto-update.
# publish:
#   provider: github
#   owner: clickflash
#   repo: master-releases
#   private: true

compression: normal

nsis:
  oneClick: false
  perMachine: true
  deleteAppDataOnUninstall: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  runAfterFinish: false
  shortcutName: ClickFlash Master OS

electronVersion: "39.8.7"
npmRebuild: false
asar: true

# After packing: generate SHA-256 sidecar for KioskGuardian.exe integrity check
afterPack: scripts/generate-guardian-hash.js
