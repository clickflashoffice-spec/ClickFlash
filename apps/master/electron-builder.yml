appId: com.clickflash.master
productName: ClickFlash Server
copyright: Copyright © 2025 ClickFlash Photography
# publish block removed — auto-update not applicable for on-premise kiosk deployment
# If you later add auto-update, set provider and url here.
directories:
  output: release_v2
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!pb_data/**/*"
  - "!storage/**/*"
  - "!node_modules/**/*"
  - electron-main.js
  - .env.production
extraResources:
  - from: pb_data
    to: pb_data
    filter:
      - "!**/*.db"
      - "!**/*.log"
      - "!**/uploads/**"
  - from: backend
    to: backend
    filter:
      - "**/*"
  - from: helper_scripts
    to: helper_scripts
win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: requireAdministrator
  forceCodeSigning: false
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: true
  deleteAppDataOnUninstall: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  runAfterFinish: false
  shortcutName: ClickFlash Server
