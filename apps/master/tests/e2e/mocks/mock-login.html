<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Login - ClickFlash Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #fca5a5;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>ClickFlash Master</h1>
        
        <div class="error" data-testid="error-message" id="errorMsg">
            Invalid credentials
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Identity</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    data-testid="username-input"
                    placeholder="name@starmaster.photo"
                    required
                />
            </div>
            
            <div class="form-group">
                <label for="password">Access Key</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    data-testid="password-input"
                    placeholder="••••••••"
                    required
                />
            </div>
            
            <button type="submit" data-testid="login-button">
                AUTHENTICATE
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Mock authentication
            if (email === 'admin' && password === 'password') {
                // Success - redirect to dashboard
                window.location.href = '/dashboard.html';
            } else {
                // Show error
                document.getElementById('errorMsg').classList.add('show');
            }
        });
    </script>
</body>
</html>
