appId: com.clickflash.pro
---
- launchApp:
    clearState: true

# Wait for the app to fully load
- extendedWaitUntil:
    visible: "Login"
    timeout: 10000

# Mock login
- tapOn: "Email"
- inputText: "test@clickflash.com"
- tapOn: "Password"
- inputText: "password123"
- tapOn: "Login"

# Wait for the dashboard
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 10000

# Navigate to POS / Checkout
- tapOn: "Checkout"

# Wait for the POS screen
- extendedWaitUntil:
    visible: "Point of Sale"
    timeout: 5000

# Add a Digital Package to Cart
- tapOn: "All Inclusive Digital"

# Proceed to payment
- tapOn: "Pay with Card"

# Assert Success
- extendedWaitUntil:
    visible: "Payment Successful"
    timeout: 10000
