[package]
name = "clickflash-rust-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = "0.21.1" # For Android bindings
# uniffi = "0.24" # For generating Swift/Kotlin bindings automatically (future)
sha2 = "0.10.8"
hmac = "0.12.1"
base64 = "0.21.7"
tokio = { version = "1.36", features = ["full"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json"] }
image = "0.24.7"
