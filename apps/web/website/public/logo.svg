<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Background -->
  <rect width="400" height="120" rx="16" fill="#0EA5E9"/>
  
  <!-- Camera Icon -->
  <g transform="translate(30, 20)">
    <!-- Camera body -->
    <rect x="10" y="25" width="70" height="50" rx="8" fill="white"/>
    <!-- Camera top -->
    <rect x="25" y="15" width="30" height="12" rx="3" fill="white"/>
    <!-- Lens outer -->
    <circle cx="45" cy="50" r="20" fill="#0EA5E9"/>
    <!-- Lens inner -->
    <circle cx="45" cy="50" r="14" fill="white"/>
    <!-- Lens highlight -->
    <circle cx="40" cy="45" r="5" fill="#0EA5E9" opacity="0.3"/>
    <!-- Flash -->
    <rect x="20" y="30" width="15" height="8" rx="2" fill="#0EA5E9"/>
  </g>
  
  <!-- Vertical Separator -->
  <rect x="130" y="20" width="3" height="80" rx="1.5" fill="white" opacity="0.8"/>
  
  <!-- CLICK Text -->
  <text x="155" y="58" font-family="Outfit, sans-serif" font-size="36" font-weight="700" fill="white" letter-spacing="8">CLICK</text>
  
  <!-- FLASH Text -->
  <text x="155" y="95" font-family="Outfit, sans-serif" font-size="36" font-weight="700" fill="white" letter-spacing="8">FLASH</text>
</svg>
