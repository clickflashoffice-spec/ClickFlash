<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Cyan background square with rounded corners -->
  <rect width="120" height="120" rx="22" fill="#0EA5E9"/>

  <!-- Camera body -->
  <rect x="18" y="44" width="84" height="58" rx="10" fill="white"/>
  <!-- Camera top bump -->
  <rect x="36" y="30" width="34" height="16" rx="4" fill="white"/>
  <!-- Lens outer ring (cyan) -->
  <circle cx="60" cy="73" r="24" fill="#0EA5E9"/>
  <!-- Lens inner (white) -->
  <circle cx="60" cy="73" r="16" fill="white"/>
  <!-- Lens highlight -->
  <circle cx="54" cy="67" r="6" fill="#0EA5E9" opacity="0.3"/>
  <!-- Flash rectangle -->
  <rect x="24" y="50" width="18" height="10" rx="3" fill="#0EA5E9"/>
</svg>
