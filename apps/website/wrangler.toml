name = "clickflash-website"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Custom build command: install with ignore-scripts to avoid native module
# compilation failures (better-sqlite3, onnxruntime-node are Electron-only),
# then rebuild only the deps that need scripts for the website.
[build]
command = "pnpm install --ignore-scripts && npx @cloudflare/next-on-pages"

[build.environment]
NODE_VERSION = "20"
NPM_FLAGS = "--prefer-offline"

[env.preview]
name = "clickflash-website-preview"

[env.preview.vars]
NODE_ENV = "staging"
DEPLOY_ENV = "staging"

[env.production]
name = "clickflash-website"

[env.production.vars]
NODE_ENV = "production"
DEPLOY_ENV = "production"
