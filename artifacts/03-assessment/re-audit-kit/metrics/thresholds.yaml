# Metrics Thresholds

## Alert Thresholds

### Critical (P1 - 24hr SLA)
```yaml
critical_vulnerabilities:
  threshold: 0
  comparison: gt
  severity: critical
  action: pagerduty_immediate
  
secrets_detected:
  threshold: 0
  comparison: gt
  severity: critical
  action: pagerduty_immediate
  
gdpr_score:
  threshold: 100
  comparison: lt
  severity: critical
  action: pagerduty_immediate
```

### High (P2 - 1 week SLA)
```yaml
high_vulnerabilities:
  threshold: 5
  comparison: gt
  severity: high
  action: slack_alert

jwt_secret_hardcoded:
  threshold: 0
  comparison: gt
  severity: high
  action: pagerduty

error_rate:
  threshold: 1
  comparison: gt
  unit: percent
  severity: high
  action: pagerduty
```

### Medium (P3 - 2 week SLA)
```yaml
api_latency_p95:
  threshold: 500
  comparison: gt
  unit: ms
  severity: medium
  action: slack_alert

build_success_rate:
  threshold: 95
  comparison: lt
  unit: percent
  severity: medium
  action: slack_alert
```

### Low (P4 - 1 month SLA)
```yaml
outdated_packages:
  threshold: 10
  comparison: gt
  severity: low
  action: email_weekly
  
test_coverage:
  threshold: 80
  comparison: lt
  unit: percent
  severity: low
  action: slack_alert
```

## Health Score Calculation

```
Overall Health = (
  Security Score (30%) +
  Quality Score (25%) +
  Operations Score (25%) +
  Compliance Score (20%)
)

Security Score = 100 - (critical_vulns * 20) - (high_vulns * 5) - (secrets * 30)
Quality Score = build_success_rate * 0.5 + test_coverage * 0.5
Operations Score = 100 - (error_rate * 20) - (latency_p99 / 20)
Compliance Score = (gdpr_score + ccpa_score) / 2
```

## Dashboard Refresh Rates

| Dashboard | Refresh | Data Lag |
|-----------|---------|----------|
| Executive | 5 min | 5 min |
| Security | 1 min | 1 min |
| Operations | 10 sec | 30 sec |
| Compliance | 1 hour | 1 hour |
| Dependencies | 1 day | 1 day |