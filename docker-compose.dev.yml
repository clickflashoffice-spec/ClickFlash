# ClickFlash Development Environment
# Run with: docker-compose -f docker-compose.dev.yml up -d
# Uses pnpm for package management (monorepo standard)

version: '3.8'

services:
  # ==========================================
  # Master Station (Backend + Frontend)
  # ==========================================
  master:
    build:
      context: .
      dockerfile: apps/master/Dockerfile.dev
    container_name: clickflash-master-dev
    volumes:
      - ./apps/master:/app
      - ./packages:/packages
      - master-node-modules:/app/node_modules
      - master-data:/app/data
      - master-uploads:/app/uploads
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=development
      - PORT=8090
      - DATABASE_PATH=/app/data/clickflash.db
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_mock_secret_key_for_ci_tests}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_mock_webhook_secret_for_ci}
      - CLOUD_HUB_URL=${CLOUD_HUB_URL:-}
      - CLOUD_HUB_API_KEY=${CLOUD_HUB_API_KEY:-}
    networks:
      - clickflash-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8090/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Touch Kiosk (Backend + Frontend)
  # ==========================================
  touch:
    build:
      context: .
      dockerfile: apps/touch/Dockerfile.dev
    container_name: clickflash-touch-dev
    volumes:
      - ./apps/touch:/app
      - ./packages:/packages
      - touch-node-modules:/app/node_modules
      - touch-data:/app/data
    ports:
      - "8091:8091"
    environment:
      - NODE_ENV=development
      - PORT=8091
      - DATABASE_PATH=/app/data/touch.db
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production}
      - MASTER_URL=http://master:8090
    networks:
      - clickflash-network
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8091/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Management Hub (Vite dev server)
  # ==========================================
  management:
    build:
      context: .
      dockerfile: apps/management/Dockerfile.dev
    container_name: clickflash-management-dev
    volumes:
      - ./apps/management:/app
      - ./packages:/packages
      - management-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8090
    networks:
      - clickflash-network
    command: pnpm dev -- --host
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Customer Gallery (Vite dev server)
  # ==========================================
  gallery:
    build:
      context: .
      dockerfile: apps/gallery/Dockerfile.dev
    container_name: clickflash-gallery-dev
    volumes:
      - ./apps/gallery:/app
      - ./packages:/packages
      - gallery-node-modules:/app/node_modules
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8090
    networks:
      - clickflash-network
    command: pnpm dev -- --host
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5174', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Website (Next.js dev server)
  # ==========================================
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile.dev
    container_name: clickflash-website-dev
    volumes:
      - ./apps/website:/app
      - ./packages:/packages
      - website-node-modules:/app/node_modules
      - website-next-cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    networks:
      - clickflash-network
    command: pnpm dev
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # MoneyTrash (Vite dev server for frontend)
  # ==========================================
  moneytrash:
    build:
      context: .
      dockerfile: apps/moneytrash/Dockerfile.dev
    container_name: clickflash-moneytrash-dev
    volumes:
      - ./apps/moneytrash:/app
      - ./packages:/packages
      - moneytrash-node-modules:/app/node_modules
    ports:
      - "1420:1420"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8090
      - VITE_WS_URL=ws://localhost:8090
    networks:
      - clickflash-network
    command: pnpm dev -- --host
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1420', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Shared Services
  # ==========================================

  # Redis (for caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: clickflash-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - clickflash-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO (S3-compatible storage for local dev)
  minio:
    image: minio/minio:latest
    container_name: clickflash-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - clickflash-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mailhog (email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: clickflash-mailhog-dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - clickflash-network

# ==========================================
# Volumes
# ==========================================
volumes:
  master-node-modules:
  master-data:
  master-uploads:
  touch-node-modules:
  touch-data:
  management-node-modules:
  gallery-node-modules:
  website-node-modules:
  website-next-cache:
  moneytrash-node-modules:
  redis-data:
  minio-data:

# ==========================================
# Networks
# ==========================================
networks:
  clickflash-network:
    driver: bridge
