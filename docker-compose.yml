# ClickFlash Ecosystem - Production Environment
# Run with: docker-compose up -d
# Includes all 6 apps + shared services

version: '3.8'

services:
  # ==========================================
  # Master Station (Backend + Frontend)
  # ==========================================
  master:
    build:
      context: ./apps/master
      dockerfile: Dockerfile
    container_name: clickflash-master
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=8090
      - DATABASE_PATH=/data/clickflash.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CLOUD_HUB_URL=${CLOUD_HUB_URL}
      - CLOUD_HUB_API_KEY=${CLOUD_HUB_API_KEY}
    volumes:
      - master-data:/data
      - master-uploads:/uploads
    networks:
      - clickflash-frontend
      - clickflash-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8090/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Touch Kiosk (Backend + Frontend)
  # ==========================================
  touch:
    build:
      context: ./apps/touch
      dockerfile: Dockerfile
    container_name: clickflash-touch
    ports:
      - "8091:8091"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=8091
      - DATABASE_PATH=/data/touch.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - MASTER_URL=http://master:8090
    volumes:
      - touch-data:/data
    networks:
      - clickflash-frontend
      - clickflash-backend
    restart: unless-stopped
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8091/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Management Hub (Cloudflare Worker - local simulation)
  # ==========================================
  management:
    build:
      context: ./apps/management
      dockerfile: Dockerfile
    container_name: clickflash-management
    ports:
      - "8092:8092"
    environment:
      - NODE_ENV=production
      - PORT=8092
      - DATA_DIR=/data
    volumes:
      - management-data:/data
    networks:
      - clickflash-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8092/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Customer Gallery (Cloudflare Worker - local simulation)
  # ==========================================
  gallery:
    build:
      context: ./apps/gallery
      dockerfile: Dockerfile
    container_name: clickflash-gallery
    ports:
      - "8093:8093"
    environment:
      - NODE_ENV=production
      - PORT=8093
      - DATA_DIR=/data
    volumes:
      - gallery-data:/data
    networks:
      - clickflash-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8093/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # MoneyTrash Uploader (Tauri - local dev server)
  # ==========================================
  moneytrash:
    build:
      context: ./apps/moneytrash
      dockerfile: Dockerfile
    container_name: clickflash-moneytrash
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - clickflash-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Website (Next.js static export)
  # ==========================================
  website:
    build:
      context: ./apps/website
      dockerfile: Dockerfile
    container_name: clickflash-website
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - clickflash-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # PostgreSQL (for production data)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: clickflash-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=clickflash
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=clickflash
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - clickflash-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickflash"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis (for caching/sessions)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: clickflash-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - clickflash-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================
  # MinIO (S3-compatible storage)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: clickflash-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio-data:/data
    networks:
      - clickflash-backend
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # imgproxy (On-the-fly image processing CDN)
  # OSS Alternative: Replaces custom sharp-based image resizing
  # ==========================================
  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: clickflash-imgproxy
    ports:
      - "8082:8080"
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?IMGPROXY_KEY is required}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?IMGPROXY_SALT is required}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_JPEG_PROGRESSIVE: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_QUALITY: 85
      IMGPROXY_WATERMARK_OPACITY: 0.3
    networks:
      - clickflash-backend
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # Ollama (Local LLM Serving)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: clickflash-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - clickflash-backend
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 4G

  # ==========================================
  # GlitchTip (Sentry-Compatible Error Monitoring)
  # ==========================================
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: clickflash-glitchtip
    ports:
      - "8084:8000"
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?GLITCHTIP_DB_PASSWORD required}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY required}
      PORT: "8000"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: 90
    networks:
      - clickflash-backend
    depends_on:
      glitchtip-db:
        condition: service_healthy
    restart: unless-stopped

  glitchtip-db:
    image: postgres:16-alpine
    container_name: clickflash-glitchtip-db
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?GLITCHTIP_DB_PASSWORD required}
    volumes:
      - glitchtip-db-data:/var/lib/postgresql/data
    networks:
      - clickflash-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # SuperTokens (Unified Auth)
  # ==========================================
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: clickflash-supertokens
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://supertokens:${SUPERTOKENS_DB_PASSWORD:?required}@supertokens-db:5432/supertokens"
    networks:
      - clickflash-backend
    depends_on:
      supertokens-db:
        condition: service_healthy
    restart: unless-stopped

  supertokens-db:
    image: postgres:16-alpine
    container_name: clickflash-supertokens-db
    environment:
      POSTGRES_DB: supertokens
      POSTGRES_USER: supertokens
      POSTGRES_PASSWORD: ${SUPERTOKENS_DB_PASSWORD:?required}
    volumes:
      - supertokens-db-data:/var/lib/postgresql/data
    networks:
      - clickflash-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertokens"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Svix (Webhook Management)
  # ==========================================
  svix:
    image: svix/svix-server:latest
    container_name: clickflash-svix
    ports:
      - "8071:8071"
    environment:
      SVIX_DB_DSN: "postgresql://svix:${SVIX_DB_PASSWORD:?required}@svix-db:5432/svix"
      SVIX_JWT_SECRET: ${SVIX_JWT_SECRET:?required}
      SVIX_QUEUE_TYPE: memory
    networks:
      - clickflash-backend
    depends_on:
      svix-db:
        condition: service_healthy
    restart: unless-stopped

  svix-db:
    image: postgres:16-alpine
    container_name: clickflash-svix-db
    environment:
      POSTGRES_DB: svix
      POSTGRES_USER: svix
      POSTGRES_PASSWORD: ${SVIX_DB_PASSWORD:?required}
    volumes:
      - svix-db-data:/var/lib/postgresql/data
    networks:
      - clickflash-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svix"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  clickflash-frontend:
    driver: bridge
  clickflash-backend:
    driver: bridge

volumes:
  master-data:
  master-uploads:
  touch-data:
  management-data:
  gallery-data:
  postgres-data:
  redis-data:
  minio-data:
  ollama-models:
  glitchtip-db-data:
  supertokens-db-data:
  svix-db-data:
