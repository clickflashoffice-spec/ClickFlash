account_id = "<REDACTED:CF_ACCOUNT_ID>"

name = "gallery-backend"
main = "src/server.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.clickflash.com", custom_domain = true }
]

[env.staging]
name = "gallery-backend-staging"

[[env.staging.d1_databases]]
binding = "GALLERY_DB"
database_name = "gallery-db-staging"
database_id = "STAGING_GALLERY_DB_ID_HERE"
migrations_dir = "migrations"

[[env.staging.d1_databases]]
binding = "WEBSITE_DB"
database_name = "clickflash-website-db-staging"
database_id = "STAGING_WEBSITE_DB_ID_HERE"
migrations_dir = "migrations/website"

[[env.staging.r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "clickflash-gallery-assets-staging"

[env.staging.vars]
NODE_ENV = "staging"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:8090"
GALLERY_PUBLIC_URL = "http://localhost:5176/gallery/"
FROM_EMAIL = "support@clickflash.com"
ADMIN_NOTIFICATION_EMAIL = "clickflash.office@gmail.com"
DEPLOY_ENV = "staging"
GEO_RESTRICTED = "false"
ALLOWED_COUNTRIES = ""
WAF_RATE_LIMIT = "1000/min"
SENTRY_PROJECT = "clickflash-gallery-staging"
# Staging secrets:
# wrangler secret put JWT_SECRET --env staging
# wrangler secret put STRIPE_SECRET_KEY --env staging

[[d1_databases]]
binding = "GALLERY_DB"
database_name = "gallery-db"
database_id = "b556a025-1ada-46f1-ac15-2f7d117ca350" 
migrations_dir = "migrations"

[[d1_databases]]
binding = "WEBSITE_DB"
database_name = "clickflash-website-db"
database_id = "5f78535b-10d3-45b4-af94-a6e5a061cac5"
migrations_dir = "migrations/website"

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "clickflash-gallery-assets"

[vars]
NODE_ENV = "production"
ALLOWED_ORIGINS = "https://gallery.clickflash.com,https://clickflash.com,https://www.clickflash.com,https://admin.clickflash.com"
GALLERY_PUBLIC_URL = "https://gallery.clickflash.com/gallery/"
FROM_EMAIL = "support@clickflash.com"
ADMIN_NOTIFICATION_EMAIL = "clickflash.office@gmail.com"
DEPLOY_ENV = "production"

# Hardened Security Policy
GEO_RESTRICTED = "false"
ALLOWED_COUNTRIES = "MA,TN,FR,US"
WAF_RATE_LIMIT = "100/min"
SENTRY_PROJECT = "clickflash-gallery"

# Secrets — set via CLI:
# Production is the top-level Wrangler environment; select it explicitly.
# wrangler secret put JWT_SECRET --env=""
# wrangler secret put STRIPE_SECRET_KEY --env=""
# wrangler secret put STRIPE_WEBHOOK_SECRET --env=""
# wrangler secret put RESEND_API_KEY --env=""

[triggers]
crons = ["0 * * * *"]  # Every hour — abandoned cart recovery emails

[observability]
enabled = true

