name = "management-hub"
main = "src/server.ts"
compatibility_date = "2024-10-01"
compatibility_flags = [ "nodejs_compat" ]


[placement]
mode = "smart"

[env.staging]
name = "management-hub-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "management-db-staging"
database_id = "STAGING_DB_ID_HERE"

[[env.staging.r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "clickflash-gallery-assets-staging"

[[env.staging.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "clickflash-backups-staging"

[env.staging.vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:8090"
FROM_EMAIL = "support@clickflash.com"
GALLERY_PUBLIC_URL = "http://localhost:5176/gallery/"
BILLING_RETURN_URL = "https://staging.management-hub.pages.dev/manage"
DEPLOY_ENV = "staging"
MAX_REQS_PER_MINUTE = 600
GEO_RESTRICTED = "false"
ALLOWED_COUNTRIES = ""
# Staging secrets:
# wrangler secret put JWT_SECRET --env staging

[[d1_databases]]
binding = "DB"
database_name = "management-db"
database_id = "983b7087-b6e9-4468-9c92-1965309ce2df"
# Multi-Region Read Replication is enabled in Cloudflare D1 dashboard.
# CloudSyncService failover routing automatically falls back to secondary worker endpoints if primary region fails.

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "clickflash-gallery-assets"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "clickflash-backups"

[vars]
ALLOWED_ORIGINS = "https://manage.clicketflash.com,https://admin.clicketflash.com,https://www.clicketflash.com,https://clicketflash.com,https://gallery.clicketflash.com,https://admin.clickflash.com,https://www.clickflash.com,https://clickflash.com,https://gallery.clickflash.com"
FROM_EMAIL = "support@clicketflash.com"
DEPLOY_ENV = "production"
FRONTEND_URL = "https://manage.clicketflash.com"
GALLERY_PUBLIC_URL = "https://gallery.clicketflash.com/gallery/"
BILLING_RETURN_URL = "https://manage.clicketflash.com"

# Hardened WAF Rate Limiting vars
MAX_REQS_PER_MINUTE = 60
GEO_RESTRICTED = "false"
ALLOWED_COUNTRIES = "MA,TN,FR,US"

# Production is the top-level Wrangler environment; select it explicitly.
# wrangler secret put JWT_SECRET --env=""
# wrangler secret put PROVISIONING_SECRET --env=""
# wrangler secret put LICENSE_PRIVATE_KEY --env=""
# wrangler secret put STRIPE_PRO_PRICE_ID --env=""
# wrangler secret put STRIPE_SECRET_KEY --env=""
# wrangler secret put STRIPE_WEBHOOK_SECRET --env=""

[observability]
enabled = true
