# MoneyTrash Cloudflare Configuration
# Deploy with: wrangler deploy

name = "moneytrash-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Enable Smart Placement to optimize routing for D1 database latency
placement = { mode = "smart" }

# Cloudflare D1 Database (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "moneytrash-db"
database_id = "c28e69b6-e2db-4582-a438-f0676a5f25f1"

# Cloudflare R2 Storage (S3-compatible)
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "moneytrash-uploads"

# Cloudflare KV (Upload sessions & caching)
[[kv_namespaces]]
binding = "UPLOAD_SESSIONS"
id = "bdb3683d7add4fd58df28ceebe75adb0"

# Environment Variables
[vars]
ENVIRONMENT = "production"
GALLERY_APP_URL = "https://gallery.clicketflash.com/gallery/"
MAX_UPLOAD_SIZE = "524288000" # 500MB
CHUNK_SIZE = "5242880"        # 5MiB (R2 multipart minimum)
MAX_CONCURRENT_UPLOADS = "5"
ALLOWED_ORIGINS = "https://moneytrash.clicketflash.com,https://gallery.clicketflash.com,https://moneytrash.clickflash.com,https://gallery.clickflash.com"

# Secrets (set via: wrangler secret put <name>)
# JWT_SECRET - For API authentication
# MASTER_API_KEY - For provisioning new MoneyTrash offices
# STRIPE_SECRET_KEY - For payment processing
# STRIPE_WEBHOOK_SECRET - Stripe endpoint signing secret (whsec_...)
# WEBHOOK_SECRET - For securing webhooks

[env.staging]
name = "moneytrash-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "moneytrash-db-staging"
database_id = "STAGING_MONEYTRASH_DB_ID_HERE"

[[env.staging.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "moneytrash-uploads-staging"

[[env.staging.kv_namespaces]]
binding = "UPLOAD_SESSIONS"
id = "STAGING_KV_ID_HERE"

[env.staging.vars]
ENVIRONMENT = "staging"
GALLERY_APP_URL = "http://localhost:5176/gallery/"
MAX_UPLOAD_SIZE = "524288000"
CHUNK_SIZE = "5242880"
MAX_CONCURRENT_UPLOADS = "10"
ALLOWED_ORIGINS = "http://localhost:1420,http://localhost:5176,http://localhost:8090"
# Staging secrets:
# wrangler secret put JWT_SECRET --env staging
# wrangler secret put STRIPE_SECRET_KEY --env staging
# wrangler secret put STRIPE_WEBHOOK_SECRET --env staging

[triggers]
crons = ["15 * * * *"]

